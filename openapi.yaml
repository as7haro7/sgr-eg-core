openapi: 3.1.0
info:
  title: SGR-EG REST API
  version: 1.0.0
  description: Contrato de la API del Sistema de Gestión de Riesgos Empresariales Globales.
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - { name: Autenticación }
  - { name: Usuarios }
  - { name: Configuración }
  - { name: Riesgos }
  - { name: Controles }
  - { name: Mitigación }
  - { name: Auditorías }
  - { name: Cumplimiento }
  - { name: Alertas }
  - { name: Evidencias }
  - { name: Reportes }
paths:
  /auth/login:
    post:
      security: []
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, password]
              properties:
                correo: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Revocar la sesión actual
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/change-password:
    post:
      tags: [Autenticación]
      summary: Cambiar contraseña propia
