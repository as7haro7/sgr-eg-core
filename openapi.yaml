          multipart/form-data:
            schema:
              type: object
              required: [file, entityType, entityId]
              properties:
                file: { type: string, format: binary }
                entityType: { type: string }
                entityId: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /evidence/{evidenceId}/download:
    get:
      tags: [Evidencias]
      summary: Autorizar y redirigir a la descarga temporal
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "307":
          description: Redirección temporal autorizada
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /dashboard/summary:
    get:
      tags: [Reportes]
      summary: Indicadores con filtros combinables
      parameters:
        - { in: query, name: countryId, schema: { type: string, format: uuid } }
        - { in: query, name: unitId, schema: { type: string, format: uuid } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: ownerId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: periodStart, schema: { type: string, format: date } }
        - { in: query, name: periodEnd, schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /dashboard/export:
    get:
      tags: [Reportes]
      summary: Exportar los indicadores filtrados en CSV, Excel o PDF
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, xlsx, pdf]
            default: csv
        - { in: query, name: countryId, schema: { type: string, format: uuid } }
        - { in: query, name: unitId, schema: { type: string, format: uuid } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: ownerId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: periodStart, schema: { type: string, format: date } }
        - { in: query, name: periodEnd, schema: { type: string, format: date } }
      responses:
        "200":
          description: Archivo del reporte solicitado
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /audit-log:
    get:
      tags: [Reportes]
      summary: Consultar bitácora limitada por alcance
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sgr_eg_session
  parameters:
    UserId: { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
    RoleId: { in: path, name: roleId, required: true, schema: { type: string, format: uuid } }
    CountryId: { in: path, name: countryId, required: true, schema: { type: string, format: uuid } }
    UnitId: { in: path, name: unitId, required: true, schema: { type: string, format: uuid } }
    CategoryId: { in: path, name: categoryId, required: true, schema: { type: string, format: uuid } }
    RiskId: { in: path, name: riskId, required: true, schema: { type: string, format: uuid } }
    ControlId: { in: path, name: controlId, required: true, schema: { type: string, format: uuid } }
    PlanId: { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    ActionId: { in: path, name: actionId, required: true, schema: { type: string, format: uuid } }
    AuditId: { in: path, name: auditId, required: true, schema: { type: string, format: uuid } }
    FindingId: { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
    RegulationId: { in: path, name: regulationId, required: true, schema: { type: string, format: uuid } }
    RequirementId: { in: path, name: requirementId, required: true, schema: { type: string, format: uuid } }
    EvaluationId: { in: path, name: evaluationId, required: true, schema: { type: string, format: uuid } }
    AlertId: { in: path, name: alertId, required: true, schema: { type: string, format: uuid } }
    EvidenceId: { in: path, name: evidenceId, required: true, schema: { type: string, format: uuid } }
  schemas:
    JsonRequest:
      type: object
      minProperties: 1
      additionalProperties: true
    ApiResponse:
      type: object
      required: [data, message, errors]
      properties:
        data: {}
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: string }
  requestBodies:
    JsonBody:
      required: true
      description: Entrada JSON validada por el esquema del dominio.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonRequest"
  responses:
    Success:
      description: Operación correcta
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
    Error:
      description: Error validado y sin detalles internos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponse" }
